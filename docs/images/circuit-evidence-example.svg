<text xml:space="preserve" x="40" y="132" font-family="DejaVu Sans,sans-serif" font-size="36" font-weight="bold" fill="#edf4fa" text-anchor="start">Same evidence. Less digging.</text>
<text xml:space="preserve" x="40" y="171" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="normal" fill="#bccbd6" text-anchor="start">An independently drawn example of clearer reporting—not a screenshot of an operational script.</text>
