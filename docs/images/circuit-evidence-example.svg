<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
<title id="title">Same fictional readings, easier to read: raw output and a compact circuit evidence report.</title>
<desc id="desc">Before and after illustration with two fictional modules and four lanes. Both states are UP. The same TX, RX and SNR values appear in both panels; Side Z lane 3 SNR is unavailable and is not replaced with zero. No real tool output, ticket or device data is used.</desc>
